# Workflow: validates changes targeting the development and production branches.
name: CI

# Workflow triggers: validate pull requests and deployable changes for both
# environments; manual runs support the controlled smoke-test failure exercise.
on:
  workflow_dispatch:
    inputs:
      force_smoke_failure:
        description: Force a controlled smoke-test failure without promoting the candidate
        required: false
        default: false
        type: boolean
  push:
    branches: [develop, main]
    # A documentation-only merge was already secret-scanned in its pull
    # request and does not produce a different application artifact.
    paths-ignore:
      - README.md
      - LICENSE
      - "docs/**"
      - "specs/**"
  pull_request:
    branches: [develop, main]

# Jobs: first classify the change, then run only the applicable validation gates.
jobs:
  changes:
    # Change classifier: preserve required PR checks without building an
    # unchanged application for documentation-only pull requests.
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_pipeline: ${{ steps.classify.outputs.run_pipeline }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect deploy-relevant changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Non-documentation pushes that reach this workflow always run the
          # complete pipeline. Pull requests require path classification.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "run_pipeline=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_paths < <(
            git diff --no-renames --name-only --diff-filter=ACMRTD \
              "${BASE_SHA}" "${HEAD_SHA}"
          )

          # An empty or unreadable classification must fail safe by running
          # the pipeline instead of accidentally skipping validation.
          run_pipeline=true
          if (( ${#changed_paths[@]} > 0 )); then
            run_pipeline=false

            for changed_path in "${changed_paths[@]}"; do
              case "${changed_path}" in
                README.md|LICENSE|docs/*|specs/*)
                  ;;
                *)
                  run_pipeline=true
                  break
                  ;;
              esac
            done
          fi

          echo "run_pipeline=${run_pipeline}" >> "${GITHUB_OUTPUT}"

  build-and-test:
    # Job: compile the application and run every test suite.
    name: Build and test
    needs:
      - changes
    if: needs.changes.outputs.run_pipeline == 'true'
    # Runner: GitHub-hosted Ubuntu includes the Docker daemon used by Testcontainers.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Steps: checkout, configure the toolchain/cache, then build and test.
    steps:
      # Step 1: retrieve the source code before any build operation.
      - name: Checkout
        uses: actions/checkout@v7

      # Step 2: install the Java version required by the Gradle build.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # Step 3: this action restores and saves the Gradle dependency/build cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Step 4: Testcontainers starts an ephemeral PostgreSQL 16 database for
      # integration tests; Docker is available on GitHub-hosted Ubuntu runners.
      - name: Build, unit tests, and integration tests
        run: ./gradlew clean build --no-daemon

  # Dependency scan: blocks high and critical known vulnerabilities (CVSS >= 7).
  dependency-scan:
    name: Dependency scan
    needs:
      - changes
    if: needs.changes.outputs.run_pipeline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Dependency-Check vulnerability data
        uses: actions/cache@v6
        with:
          path: .dependency-check-data
          key: ${{ runner.os }}-dependency-check-v12-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-

      - name: Scan dependencies for known vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-reports
          path: build/reports
          if-no-files-found: warn

  # Build dependency scan: blocks high and critical CVEs in the Gradle plugin
  # classpath separately from the deployable runtime.
  build-dependency-scan:
    name: Build dependency scan
    needs:
      - changes
      - dependency-scan
    if: needs.changes.outputs.run_pipeline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Dependency-Check vulnerability data
        uses: actions/cache@v6
        with:
          path: .dependency-check-data
          key: ${{ runner.os }}-dependency-check-v12-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-v12-

      - name: Inventory Gradle plugin classpath
        run: |
          set -o pipefail
          mkdir -p build/reports/build-dependencies
          ./gradlew buildEnvironment --no-daemon --console=plain | tee build/reports/build-dependencies/gradle-build-environment.txt

      - name: Scan Gradle plugin classpath for known vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckBuildEnvironment --no-daemon

      - name: Upload build dependency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-dependency-reports
          path: build/reports/build-dependencies
          if-no-files-found: warn

  # Secret scan: fetches repository history so that earlier accidental leaks are detected.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Static analysis: Checkstyle reports quality violations for production and test code.
  static-analysis:
    name: Static analysis
    needs:
      - changes
    if: needs.changes.outputs.run_pipeline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: build/reports/checkstyle
          if-no-files-found: warn

  # Image publishing: deployable pushes or manual runs on either environment
  # branch publish only after every build, test, security, and quality gate.
  image-publish:
    name: Build and publish image
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      needs.changes.outputs.run_pipeline == 'true'
    needs:
      - changes
      - build-and-test
      - dependency-scan
      - build-dependency-scan
      - secret-scan
      - static-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: project-c42baf60-7736-408b-9ff
      REGION: europe-west8
      REPOSITORY: cloud-native-api
      IMAGE_NAME: cloud-native-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: docker build --tag "${IMAGE}:${GITHUB_SHA}" --tag "${IMAGE}:latest" .

      - name: Push image tags
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Report pushed image digest
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}"

  # Call the reusable delivery workflow only after the immutable image exists.
  deploy:
    name: Deploy candidate and promote
    needs:
      - image-publish
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cloud-run-deploy.yml
    with:
      project_id: project-c42baf60-7736-408b-9ff
      region: europe-west8
      repository: cloud-native-api
      image_name: cloud-native-api
      deployment_environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      force_smoke_failure: ${{ inputs.force_smoke_failure || false }}
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
