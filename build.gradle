plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.cloudnativeapi'
version = '0.0.1-SNAPSHOT'
description = 'Spec-driven cloud-native CI/CD learning project'

ext['tomcat.version'] = '11.0.25'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	buildPluginClasspath {
		canBeConsumed = false
		canBeResolved = true
		visible = false
	}
}

dependencies {
	// Mirrors the plugins DSL classpath so Dependency-Check can scan it.
	buildPluginClasspath 'org.springframework.boot:org.springframework.boot.gradle.plugin:4.1.0'
	buildPluginClasspath 'io.spring.dependency-management:io.spring.dependency-management.gradle.plugin:1.1.7'
	buildPluginClasspath 'org.owasp.dependencycheck:org.owasp.dependencycheck.gradle.plugin:12.2.2'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	runtimeOnly 'org.postgresql:postgresql:42.7.12'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

checkstyle {
	configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
	reports {
		html.required = true
		sarif.required = true
	}
}

dependencyCheck {
	failBuildOnCVSS = 7.0
	formats = ['HTML', 'JSON', 'SARIF']
	suppressionFile = 'config/dependency-check/suppressions.xml'
	scanConfigurations = ['runtimeClasspath']
	skipTestGroups = false
	data.directory = file('.dependency-check-data').absolutePath
	nvd.apiKey = System.getenv('NVD_API_KEY')
}

tasks.register('dependencyCheckBuildEnvironment', org.owasp.dependencycheck.gradle.tasks.Analyze) {
	group = 'verification'
	description = 'Generates an informational CVE report for the Gradle build environment.'

	dependencyCheck {
		failBuildOnCVSS = 7.0
		formats = ['HTML', 'JSON', 'SARIF']
		outputDirectory = file('build/reports/build-dependencies/dependency-check')
		suppressionFile = 'config/dependency-check/build-suppressions.xml'
		scanBuildEnv = false
		scanConfigurations = ['buildPluginClasspath']
		scanSet = []
		skipTestGroups = false
		data.directory = file('.dependency-check-data').absolutePath
		nvd.apiKey = System.getenv('NVD_API_KEY')
	}
}
