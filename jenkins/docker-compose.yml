services:
  controller:
    # Build a project-owned controller image with the required plugins already
    # installed, while keeping runtime configuration in the persistent volume.
    build:
      context: ./controller
    image: cloud-native-api-jenkins-controller:2.568.2
    ports:
      # Port 8081 avoids colliding with the API, which uses host port 8080.
      - "${JENKINS_HTTP_PORT:-8081}:8080"
    expose:
      # Inbound agents use this port only inside the private Compose network.
      - "50000"
    volumes:
      # Users, plugins, nodes, credentials, and job history survive recreation
      # of the controller container as long as this volume is retained.
      - jenkins_home:/var/jenkins_home
    environment:
      # Skip the interactive wizard because JCasC now supplies the initial
      # security and system configuration on every Controller startup.
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/jenkins.yaml
      CASC_STRICT_SECRET_RESOLUTION: "true"
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?Set JENKINS_ADMIN_ID in jenkins/.env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      JENKINS_GITHUB_USERNAME: ${JENKINS_GITHUB_USERNAME:?Set JENKINS_GITHUB_USERNAME in jenkins/.env}
      JENKINS_GITHUB_TOKEN: ${JENKINS_GITHUB_TOKEN:?Set JENKINS_GITHUB_TOKEN in jenkins/.env}
      JENKINS_NVD_API_KEY: ${JENKINS_NVD_API_KEY:?Set JENKINS_NVD_API_KEY in jenkins/.env}
    restart: unless-stopped
    networks:
      - jenkins_network

  build-test-agent:
    # This static inbound agent executes Gradle build and test workloads. JCasC
    # creates its Controller-side node definition, while Compose keeps the
    # runtime container reproducible and supplies its local connection secret.
    build:
      context: ./build-test-agent
    image: cloud-native-api-jenkins-build-test-agent:3386-jdk25
    environment:
      # Docker DNS resolves "controller" to the Controller container on the
      # private Compose network; Windows localhost would point to this agent.
      JENKINS_URL: http://controller:8080
      JENKINS_TUNNEL: controller:50000
      JENKINS_AGENT_NAME: build-test-agent
      JENKINS_SECRET: ${JENKINS_BUILD_AGENT_SECRET:?Set JENKINS_BUILD_AGENT_SECRET in jenkins/.env}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      # Keep Gradle downloads and Dependency-Check vulnerability data outside
      # disposable branch workspaces and agent container layers.
      GRADLE_USER_HOME: /home/jenkins/.gradle
      DEPENDENCY_CHECK_DATA_DIRECTORY: /home/jenkins/.dependency-check-data
      # PostgreSQL Testcontainers publish random ports through Docker Desktop;
      # the agent reaches those host ports through this special DNS name.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    depends_on:
      - controller
    # Docker Desktop exposes the mounted socket as root:root with group write
    # access, so this supplementary group lets the Jenkins user open it.
    group_add:
      - "0"
    volumes:
      # Gradle and NVD data have different lifecycles and can be cleaned or
      # inspected independently without deleting Jenkins Controller state.
      - gradle_cache:/home/jenkins/.gradle
      - dependency_check_data:/home/jenkins/.dependency-check-data
      # Testcontainers uses the host daemon to create sibling PostgreSQL and
      # Ryuk containers; this does not install a daemon inside the agent.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - jenkins_network

  docker-agent:
    # Keep Docker operations on a dedicated agent because access to the host
    # Docker Engine is substantially more privileged than a normal build.
    build:
      context: ./docker-agent
    image: cloud-native-api-jenkins-docker-agent:3386-docker29
    environment:
      JENKINS_URL: http://controller:8080
      JENKINS_TUNNEL: controller:50000
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${JENKINS_DOCKER_AGENT_SECRET:?Set JENKINS_DOCKER_AGENT_SECRET in jenkins/.env}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    depends_on:
      - controller
    # Docker Desktop exposes the mounted socket as root:root with group write
    # access. Supplementary group 0 lets the unprivileged Jenkins user use it.
    group_add:
      - "0"
    volumes:
      # Share the host daemon instead of starting a second Docker daemon in the
      # agent. Images and containers are therefore managed by Docker Desktop.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - jenkins_network

  webhook-relay:
    # GitHub cannot reach a Controller bound to the developer's localhost.
    # Smee receives the public webhook and this client forwards it privately.
    build:
      context: ./webhook-relay
    image: cloud-native-api-jenkins-webhook-relay:5.0.0
    command:
      - --url
      - ${JENKINS_WEBHOOK_RELAY_URL:?Set JENKINS_WEBHOOK_RELAY_URL in jenkins/.env}
      - --target
      # Smee removes a trailing slash from target URLs. The harmless query
      # parameter preserves Jenkins' required /github-webhook/ path and avoids
      # a POST-to-GET redirect that the GitHub plugin rejects with HTTP 405.
      - http://controller:8080/github-webhook/?source=smee
    depends_on:
      - controller
    restart: unless-stopped
    networks:
      - jenkins_network

volumes:
  jenkins_home:
    name: cloud-native-api-jenkins-home
  gradle_cache:
    name: cloud-native-api-jenkins-gradle-cache
  dependency_check_data:
    name: cloud-native-api-jenkins-dependency-check-data

networks:
  jenkins_network:
    name: cloud-native-api-jenkins-network
