spring:
  application:
    name: cloud-native-api
  datasource:
    # Local and deployed credentials are supplied exclusively through the environment.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  forward-headers-strategy: framework

logging:
  # Keep Hibernate connection warnings and errors while preventing its INFO
  # startup summary from writing the complete JDBC URL to application logs.
  level:
    org.hibernate.orm.connections.pooling: WARN

  # Emit one portable Logstash JSON object per stdout line. Cloud Run promotes
  # the renamed top-level severity member and keeps the remaining fields
  # searchable in jsonPayload; Spring Boot adds MDC values when present.
  structured:
    format:
      console: logstash
    json:
      rename:
        level: severity

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

      # Keep Cloud Run's lifecycle probes focused on the container while
      # exposing a separate endpoint that also verifies the database.
      group:
        external:
          include: readinessState,db
